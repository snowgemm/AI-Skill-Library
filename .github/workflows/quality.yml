name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "compat/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@f8cf4291c8b8e273ddd26e569454615c7315d932 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run unit and failure-path tests
        run: python -m unittest discover --start-directory tests --verbose
      - name: Validate Agent Skills format
        run: python scripts/validate_skills.py
      - name: Validate repository integrity and checksums
        run: python scripts/validate_repository.py
