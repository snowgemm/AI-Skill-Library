name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "compat/**"
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run unit and failure-path tests
        run: python -m unittest discover --start-directory tests --verbose
      - name: Validate Agent Skills format
        run: python scripts/validate_skills.py
      - name: Validate repository integrity and checksums
        run: python scripts/validate_repository.py
      - name: Validate workflow security invariants
        run: python scripts/validate_workflow_security.py

  workflow-security:
    name: GitHub Actions static security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: v1.32.0
          min-severity: medium
          min-confidence: medium
