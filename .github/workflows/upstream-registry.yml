name: Check upstream skill repositories

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream heads and open a registry PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const path = "catalog/external-sources.json";
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: base });
            const registry = JSON.parse(Buffer.from(current.data.content, "base64").toString("utf8"));
            const checkedAt = new Date().toISOString();
            const changes = [];

            for (const source of registry.sources) {
              const [upstreamOwner, upstreamRepo] = source.repository.split("/");
              if (!upstreamOwner || !upstreamRepo) continue;
              try {
                const result = await github.rest.repos.listCommits({
                  owner: upstreamOwner,
                  repo: upstreamRepo,
                  per_page: 1
                });
                const latest = result.data[0];
                if (!latest) continue;
                const baseline = source.upstream_latest_commit || source.commit;
                source.upstream_latest_commit = latest.sha;
                source.upstream_latest_commit_date =
                  latest.commit.committer?.date || latest.commit.author?.date || null;
                source.upstream_latest_checked_at = checkedAt;
                source.upstream_update_available = latest.sha !== source.commit;
                if (latest.sha !== baseline) {
                  changes.push({
                    repository: source.repository,
                    pinned: source.commit,
                    previous_head: baseline,
                    latest: latest.sha
                  });
                }
              } catch (error) {
                core.warning(`Could not check ${source.repository}: ${error.message}`);
              }
            }

            if (changes.length === 0) {
              core.info("All reachable upstream heads match the recorded tracking baselines.");
              return;
            }

            const date = checkedAt.slice(0, 10).replace(/-/g, "");
            const branch = `bot/upstream-registry-${date}`;
            const open = await github.rest.pulls.list({
              owner, repo, state: "open", base,
              head: `${owner}:${branch}`
            });

            let branchSha;
            if (open.data.length > 0) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              branchSha = ref.data.object.sha;
            } else {
              const mainRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
              branchSha = mainRef.data.object.sha;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha: branchSha
              });
            }

            let branchFile;
            try {
              branchFile = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            } catch {
              branchFile = current;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: "chore(registry): record upstream skill updates",
              sha: branchFile.data.sha,
              content: Buffer.from(JSON.stringify(registry, null, 2) + "\n").toString("base64")
            });

            if (open.data.length === 0) {
              const summary = changes.map(item =>
                `- ${item.repository}: \`${item.pinned}\` → \`${item.latest}\``
              ).join("\n");
              await github.rest.pulls.create({
                owner, repo, head: branch, base,
                title: "chore(registry): upstream skill updates detected",
                body: [
                  "Automated weekly upstream check detected new commits.",
                  "",
                  summary,
                  "",
                  "This PR updates tracking metadata only. It does not replace pinned imports or modify skill bodies.",
                  "Review upstream diffs, licenses, references, scripts, and security before manually updating portable skills."
                ].join("\n")
              });
            }
            core.info(`Opened or updated ${branch} with ${changes.length} upstream change(s).`);
