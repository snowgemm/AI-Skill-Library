name: Check upstream skill repositories

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Read-only upstream drift scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_drift: ${{ steps.scan.outputs.has_drift }}
      drift_json: ${{ steps.scan.outputs.drift_json }}
      checked_at: ${{ steps.scan.outputs.checked_at }}
    steps:
      - name: Compare imported source pins with upstream default branches
        id: scan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const registryPath = "catalog/external-sources.json";
            const current = await github.rest.repos.getContent({
              owner, repo, path: registryPath, ref: "main"
            });
            if (Array.isArray(current.data) || current.data.type !== "file") {
              core.setFailed(registryPath + " is not a regular file");
              return;
            }

            let registry;
            try {
              registry = JSON.parse(Buffer.from(current.data.content, "base64").toString("utf8"));
            } catch (error) {
              core.setFailed("External source registry is not valid JSON: " + error.message);
              return;
            }
            if (!registry || !Array.isArray(registry.sources)) {
              core.setFailed("External source registry must contain a sources array");
              return;
            }

            const monitored = registry.sources.filter(source =>
              source && typeof source.portable_skill_path === "string" &&
              source.portable_skill_path.length > 0
            );
            if (monitored.length !== 5) {
              core.setFailed("Expected exactly five imported portable sources; found " + monitored.length);
              return;
            }

            const checkedAt = new Date().toISOString();
            const changes = [];
            const failures = [];

            for (const source of monitored) {
              const repository = source.repository;
              const pinned = source.commit;
              const parts = typeof repository === "string" ? repository.split("/") : [];
              if (parts.length !== 2 || parts.some(part => !/^[A-Za-z0-9_.-]+$/.test(part))) {
                failures.push("Invalid repository identifier: " + String(repository));
                continue;
              }
              if (!/^[0-9a-f]{40}$/i.test(pinned || "")) {
                failures.push(repository + ": source pin is not a full 40-character SHA");
                continue;
              }

              try {
                const result = await github.rest.repos.listCommits({
                  owner: parts[0], repo: parts[1], per_page: 1
                });
                const latest = result.data && result.data[0];
                if (!latest || !/^[0-9a-f]{40}$/i.test(latest.sha || "")) {
                  throw new Error("upstream did not return a full commit SHA");
                }
                if (latest.sha !== pinned) {
                  changes.push({
                    repository,
                    pinned,
                    latest: latest.sha,
                    latest_date:
                      (latest.commit && latest.commit.commit &&
                       latest.commit.committer && latest.commit.committer.date) ||
                      (latest.commit && latest.commit.author && latest.commit.author.date) ||
                      null
                  });
                }
              } catch (error) {
                failures.push(repository + ": " + error.message);
              }
            }

            if (failures.length > 0) {
              failures.forEach(item => core.error("Upstream scan incomplete: " + item));
              core.setFailed(
                "At least one imported source could not be checked. " +
                "The scan is not clean; no notification was published."
              );
              return;
            }

            core.setOutput("has_drift", changes.length > 0 ? "true" : "false");
            core.setOutput("drift_json", JSON.stringify(changes));
            core.setOutput("checked_at", checkedAt);
            core.info(
              "Checked all " + monitored.length +
              " imported source pins; " + changes.length + " source(s) have upstream drift."
            );

  notify:
    name: Notify about upstream drift
    needs: scan
    if: needs.scan.outputs.has_drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the single upstream review issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_JSON: ${{ needs.scan.outputs.drift_json }}
          CHECKED_AT: ${{ needs.scan.outputs.checked_at }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Upstream skill drift — review required";
            const changes = JSON.parse(process.env.DRIFT_JSON || "[]");
            if (!Array.isArray(changes) || changes.length === 0) {
              core.setFailed("The notification job received no valid drift records.");
              return;
            }

            for (const change of changes) {
              if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(change.repository || "") ||
                  !/^[0-9a-f]{40}$/i.test(change.pinned || "") ||
                  !/^[0-9a-f]{40}$/i.test(change.latest || "")) {
                core.setFailed("The notification job received an invalid repository or commit record.");
                return;
              }
            }

            const rows = changes.map(change => [
              "- **" + change.repository + "**",
              "  - Imported pin: `" + change.pinned + "`",
              "  - Current upstream HEAD: `" + change.latest + "`",
              "  - Upstream commit date: " + (change.latest_date || "not reported"),
              "  - [Review the upstream diff](https://github.com/" +
                change.repository + "/compare/" + change.pinned + "..." + change.latest + ")"
            ].join("\n")).join("\n");

            const body = [
              "## Upstream drift detected",
              "",
              "Checked at: " + (process.env.CHECKED_AT || "not reported"),
              "",
              "The following imported sources have moved beyond their recorded pins:",
              "",
              rows,
              "",
              "## Required review",
              "",
              "Review the exact skill files, references, scripts, dependencies, file-level license, " +
                "security implications and host compatibility before deciding whether to update an adaptation.",
              "",
              "**This automation is read-only.** It does not modify source pins, skill files, checksums, " +
                "branches or pull requests. It only reports drift in this issue."
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const issue = existing.data.find(item =>
              !item.pull_request && item.title === title
            );

            if (issue) {
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, body
              });
              core.info("Updated upstream drift issue #" + issue.number + ".");
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body
              });
              core.info("Created upstream drift issue #" + created.data.number + ".");
            }
